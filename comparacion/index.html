<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>N, O y P contra las mejores apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@600;800&display=swap">
<style>
:root{--papel:#EEF0F3;--sup:#FFFFFF;--sup2:#E3E7EC;--tinta:#15171C;--tinta2:#555C68;--linea:#D2D7DE;--acento:#1D6F6A;--bajo:#B42318;--medio:#8A6A00;--alto:#1E7A46;--barra:#C9D0D9;
--cuerpo:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;--titulo:"Schibsted Grotesk","Atkinson Hyperlegible",-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--papel:#0E1013;--sup:#181B20;--sup2:#232830;--tinta:#ECEEF2;--tinta2:#A4ABB6;--linea:#2E343D;--acento:#5CC3BA;--bajo:#FF8577;--medio:#F2CF4A;--alto:#5ACB8C;--barra:#3A414B}}
:root[data-theme="dark"]{--papel:#0E1013;--sup:#181B20;--sup2:#232830;--tinta:#ECEEF2;--tinta2:#A4ABB6;--linea:#2E343D;--acento:#5CC3BA;--bajo:#FF8577;--medio:#F2CF4A;--alto:#5ACB8C;--barra:#3A414B}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.5 var(--cuerpo);-webkit-text-size-adjust:100%;text-size-adjust:100%}
.pag{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--titulo);margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.sub{color:var(--tinta2)}
.etq{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
.caja{background:var(--sup);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.totales{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.total{background:var(--sup);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.total .letra{font-family:var(--titulo);font-weight:800;font-size:15px}
.total .num{font-family:var(--titulo);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.veredicto{border-left:4px solid var(--medio);padding:10px 12px;background:var(--sup);border-radius:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1.5px solid var(--linea);background:var(--sup);color:var(--tinta);border-radius:999px;padding:8px 14px;min-height:44px;font:700 14px var(--cuerpo);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--papel)}
.chip:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.dim{background:var(--sup);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dim header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.code{font:800 13px var(--titulo);color:var(--tinta2)}
.notas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nota{background:var(--sup2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.nota .fila{display:flex;justify-content:space-between;align-items:baseline}
.nota b{font-family:var(--titulo);font-size:22px;font-variant-numeric:tabular-nums}
.barra{height:6px;border-radius:9px;background:var(--barra);overflow:hidden}
.barra i{display:block;height:100%;border-radius:9px}
.apps{display:flex;gap:6px;flex-wrap:wrap}
.app{font-size:14px;border:1px solid var(--linea);border-radius:999px;padding:4px 10px;color:var(--tinta);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
a.app{color:var(--acento)}
details{border-top:1px solid var(--linea);padding-top:8px}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.lista{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.muted{font-size:14px;color:var(--tinta2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)}
.scroll{overflow-x:auto}
@media (max-width:420px){.total .num{font-size:32px}.nota b{font-size:19px}}
</style>

<script>
const D = {"filas": [{"grupo": "A", "code": "A1", "nombre": "Onboarding y primer uso", "porQue": [{"a": "Apple: «Delay sign-in for as long as possible. People often abandon apps when they're forced to sign in before they can do anything useful.»", "f": "Apple Human Interface Guidelines · Managing accounts · https://developer.apple.com/design/human-interface-guidelines/managing-accounts"}, {"a": "Apple: «Request permission only when your app clearly needs access to the data or resource.» Una pantalla propia antes del diálogo del sistema se permite si aporta detalle esencial, con un único botón tipo «Continue/Next» y sin acciones extra; nunca una pantalla que confunda o engañe.", "f": "Apple Human Interface Guidelines · Privacy · https://developer.apple.com/design/human-interface-guidelines/privacy"}], "apps": [{"app": "Life360", "url": "https://mobbin.com/flows/fb439f5d-687c-4c12-87ca-42fe945cff3f"}, {"app": "Duolingo", "url": "https://mobbin.com/flows/4511e153-c7d5-4b70-b37e-09cc798e49d9"}, {"app": "Cash App", "url": "https://mobbin.com/screens/a83fa99d-5202-4250-898a-8ccb1745143d"}], "notas": {"N": {"juez": 4, "aud": 4}, "O": {"juez": 3, "aud": 3}, "P": {"juez": 3, "aud": 3}}, "falta": {"N": "Diseñar el flujo entero: bienvenida sin carrusel, pasos 1-2, pre-permiso de ubicación y de notificaciones de robo en el momento en que se usan (beneficio en una frase, «Ahora no» con peso real, enlace «cómo usamos tu ubicación»), llegada directa al vehículo con un consejo de una línea sobre el mapa, lámina de permiso negado con camino a Ajustes y modo práctica del «NO soy yo».", "O": "Todo lo de N, más: un campo por pantalla (o tipo de documento por defecto CI) y validar recién al salir del campo.", "P": "Todo lo de N, más: un campo por pantalla, validar al salir del campo y decir junto al botón qué falta."}, "medir": "Láminas: contar pantallas desde abrir hasta ver el vehículo cuando existan. Personas: 5 clientes nuevos por segmento, tiempo hasta ver su vehículo, finalización, SEQ, y qué eligen en cada diálogo de permiso pensando en voz alta. App real: embudo instalación → cuenta → vehículo visto → aceptación de ubicación y notificaciones → D1/D7.", "enProducto": null}, {"grupo": "A", "code": "A2", "nombre": "Comprensión en una sola mirada", "porQue": [{"a": "Apple, sobre widgets: «overly dense layouts are less glanceable. Create a layout that provides essential information at a glance and allows people to view additional details by taking a longer look.»", "f": "Apple Human Interface Guidelines · Widgets · https://developer.apple.com/design/human-interface-guidelines/widgets"}, {"a": "Apple, sobre Live Activities: «Focus on important information that people need to see at a glance» y «Use large, heavier-weight text… make sure key information is legible at a glance.»", "f": "Apple Human Interface Guidelines · Live Activities · https://developer.apple.com/design/human-interface-guidelines/live-activities"}], "apps": [{"app": "Rivian", "url": "https://mobbin.com/screens/fdd5e60c-a1d2-4525-94ce-8b4bffe986a8"}, {"app": "Life360", "url": "https://mobbin.com/flows/fb439f5d-687c-4c12-87ca-42fe945cff3f"}, {"app": "Revolut", "url": "https://mobbin.com/screens/5be4e584-20cf-45a5-aade-d505997121b7"}], "notas": {"N": {"juez": 6, "aud": 6}, "O": {"juez": 5, "aud": 5}, "P": {"juez": 6, "aud": 6}}, "falta": {"N": "Un único estado que conteste «¿mi vehículo está bien?» con palabra y color que cambien por situación (Protegido / En movimiento / Alerta / Sin señal), la cuota vencida como tarjeta arriba en Inicio, sacar el texto contradictorio del freno, y bajar lo demás a una «segunda mirada» (hoja o tarjetas bajo el pliegue).", "O": "Recortar el tablero a 1 estado + 1 tarea pendiente arriba; el resto (club, grilla de servicios) fuera del Inicio o muy por debajo; no poner club y deuda con el mismo peso.", "P": "Hacer protagonista el estado (no la velocidad), un solo «42» en pantalla, explicar «Candado — sin dato», y aligerar la mitad inferior."}, "medir": "Prueba de 5 segundos con 5+ clientes por propuesta y preguntas cerradas («¿dónde estaba el auto?», «¿estaba protegido?», «¿tenías algo que hacer?»), con láminas de estados distintos (normal, en movimiento, robo, cuota vencida, sin señal). Vara interna propuesta ≥80% correcto (umbral propio, no citado). Hoy sólo existe un estado de datos (2 de 3 sin señal + cuota vencida), así que no se puede comparar entre estados.", "enProducto": null}, {"grupo": "A", "code": "A3", "nombre": "Facilidad de uso en las tareas clave", "porQue": [{"a": "Tamaño de objetivo: Apple pide una zona de toque de al menos 44×44 pt; WCAG 2.2 criterio 2.5.8 (nivel AA) pide al menos 24×24 px CSS salvo excepciones.", "f": "Apple HIG · Buttons · https://developer.apple.com/design/human-interface-guidelines/buttons · W3C · Understanding SC 2.5.8 · https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html"}, {"a": "Apple distingue notificaciones «Time Sensitive» (p. ej. un problema de seguridad de la cuenta) y «Critical» (salud y seguridad, «extremely rare»). Un aviso de robo tiene que diseñarse para ser atendido desde ahí.", "f": "Apple Human Interface Guidelines · Managing notifications · https://developer.apple.com/design/human-interface-guidelines/managing-notifications"}], "apps": [{"app": "Life360", "url": "https://mobbin.com/screens/608d04fe-cde3-4c9f-8390-79ec9db4ff89 · https://mobbin.com/screens/cd54527a-985f-4515-928e-fafefd70f842"}, {"app": "Monzo", "url": "https://mobbin.com/flows/24eaa12e-8900-4866-a4c9-60548e14487a"}, {"app": "Rivian", "url": "https://mobbin.com/screens/c25ddb40-e4a0-4f77-a9a6-9996a8afa4ed"}], "notas": {"N": {"juez": 6, "aud": 6}, "O": {"juez": 6.5, "aud": 6.5}, "P": {"juez": 5, "aud": 5}}, "falta": {"N": "Láminas de comprobante de pago con período cubierto y «qué queda después»; confirmación tras «NO soy yo» (a quién llegó, que el CM ya llama); ventana de cancelación o deshacer para «NO soy yo» y para «llamar ya»; modo práctica del aviso; separar más los dos botones; arreglar el deslizador del motor.", "O": "Lo de N salvo el tamaño/consecuencia, que ya están; más separación vertical entre las dos respuestas.", "P": "Diferenciar de verdad «Soy yo» y «NO soy yo» (relleno vs contorno, rojo lleno para el urgente), poner «Soy yo» en la actividad en vivo de la bloqueada, y lo de N (comprobante, confirmación, deshacer, práctica)."}, "medir": "Prueba de tareas con 5 clientes de auto por propuesta (idealmente un segmento de mayores): éxito, tiempo, toques en falso y SEQ por tarea; para el aviso, simular estrés (interrupción + cuenta regresiva) y contar respuestas equivocadas. App real: tiempo notificación→respuesta, % de respuestas corregidas, conversión del pago por paso con Bancard.", "enProducto": null}, {"grupo": "A", "code": "A4", "nombre": "Arquitectura de información y navegación", "porQue": [{"a": "Apple: «Use a tab bar to support navigation, not to provide actions»; mantener la barra visible («If you hide the tab bar, people can forget which area of the app they're in»); si el usuario elige pestañas, una lista por defecto de cinco o menos.", "f": "Apple Human Interface Guidelines · Tab bars · https://developer.apple.com/design/human-interface-guidelines/tab-bars"}, {"a": "Material 3: «Navigation bars offer a persistent and convenient way to switch between primary destinations in an app» y deben contener de tres a cinco destinos.", "f": "Documentación oficial Compose Material3 · NavigationBar · https://kotlinlang.org/api/compose-multiplatform/material3/androidx.compose.material3/-navigation-bar.html (la guía m3.material.io no se pudo leer: página dinámica)"}], "apps": [{"app": "Uber", "url": "https://mobbin.com/screens/ed6b9b0a-5d88-4b1b-a35c-a55e6481ddf9"}, {"app": "Airbnb", "url": "https://mobbin.com/screens/2df6111d-0888-47ab-8d35-6a2f20d66eb2"}, {"app": "Monzo", "url": "https://mobbin.com/screens/f5c5680b-88b8-4289-b068-100b3484222d"}], "notas": {"N": {"juez": 5.5, "aud": 5.5}, "O": {"juez": 5, "aud": 5}, "P": {"juez": 6, "aud": 5.5}}, "falta": {"N": "Dibujar el destino Servicios; un solo nombre por cosa en barra, títulos y notificaciones; sacar la grilla duplicada de Inicio o dejarla sólo como atajos; badge en campana/Cuenta cuando hay cuota vencida o aviso; hacer visible Alertas/Historial; separar «Fase Casa» con cambio explícito cuando llegue.", "O": "Lo de N, más: Servicios como pestaña normal (no botón flotante), un solo juego de pestañas para vehículos, Cuenta en lista agrupada.", "P": "Lo de N, más: resolver la contradicción del Club «en preparación» vs activo y quitar el crédito de mapa suelto en Cuenta."}, "medir": "Tree test con las etiquetas de cada propuesta («¿dónde pagarías tu cuota?», «¿dónde venderías tu auto?», «¿dónde ves qué pasó anoche?»): éxito directo/indirecto y primer clic. Para comparar tasas entre 3 propuestas hace falta muestra cuantitativa mayor que 5. App real: rutas hasta pagar y hasta responder un aviso, uso de AlóChat como señal de algo no encontrado.", "enProducto": null}, {"grupo": "B", "code": "B1", "nombre": "Diseño visual y terminación", "porQue": [{"a": "Efecto estética-usabilidad: la gente percibe como más usable lo que le parece atractivo. Kurosu y Kashimura (Hitachi, 1995): 26 variantes de cajero, 252 participantes; la estética correlacionó más con la facilidad PERCIBIDA que con la real.", "f": "https://www.nngroup.com/articles/aesthetic-usability-effect/"}, {"a": "Límite del mismo efecto: 'A pretty design can make users forgiving of minor usability problems, but not of large ones', y en pruebas con usuarios puede tapar problemas reales.", "f": "https://www.nngroup.com/articles/aesthetic-usability-effect/"}], "apps": [{"app": "Airbnb (citada por la vara, no reabierta)", "url": "https://mobbin.com/screens/fc136f40-7a43-4d89-9195-70d01010471f"}, {"app": "Rivian (mirada: '213 mi' + render lateral)", "url": "https://mobbin.com/screens/fdd5e60c-a1d2-4525-94ce-8b4bffe986a8"}, {"app": "Cash App (mirada: '$2.00' + 2 píldoras iguales)", "url": "https://mobbin.com/screens/18b40898-3971-46f3-9604-f1b875183119"}], "notas": {"N": {"juez": 7, "aud": 7}, "O": {"juez": 6, "aud": 6}, "P": {"juez": 7, "aud": 6.5}}, "falta": {"N": "Quitar el halo/relleno azul a la tarjeta '42' del inicio (que el '2 de 3' sea lo único que grita) y dar al borde punteado un solo significado.", "O": "Elegir UNA superficie saturada por pantalla (hoy 3-4 azules + rojo); unificar las variantes de tarjeta del bento.", "P": "No repetir la cifra '42' en el mismo pliegue; un solo estilo de ícono en listas; héroe de Tienda en la misma superficie que el resto del modo claro."}, "medir": "Inventario en Figma: valores de padding/gap (≤6, múltiplos de 4), radios (≤3), variantes de primario (=1); prueba de desenfoque 8 px por pantalla contando cuántos elementos siguen dominando (=1); prueba de 5 segundos con personas.", "enProducto": null}, {"grupo": "B", "code": "B2", "nombre": "Tipografía", "porQue": [{"a": "Apple iOS: tamaño por defecto 17 pt, mínimo 11 pt, para fuentes del sistema y propias.", "f": "https://developer.apple.com/design/human-interface-guidelines/typography"}, {"a": "Apple: 'Minimize the number of typefaces you use, even in a highly customized interface' — mezclar muchas oscurece la jerarquía.", "f": "https://developer.apple.com/design/human-interface-guidelines/typography"}], "apps": [{"app": "Rivian (mirada: '213 mi' liviano, unidad chica)", "url": "https://mobbin.com/screens/fdd5e60c-a1d2-4525-94ce-8b4bffe986a8"}, {"app": "Cash App (mirada: '$2.00' display, escala corta)", "url": "https://mobbin.com/screens/18b40898-3971-46f3-9604-f1b875183119"}, {"app": "Airbnb (citada por la vara, no reabierta)", "url": "https://mobbin.com/screens/fc136f40-7a43-4d89-9195-70d01010471f"}], "notas": {"N": {"juez": 7, "aud": 6.5}, "O": {"juez": 6, "aud": 6}, "P": {"juez": 7, "aud": 6.5}}, "falta": {"N": "Lámina en pt/en al 200% declarado; inventario ≤5 tamaños; cifras vivas con tnum medido; letra-inicio completa.", "O": "Bajar a una cifra display
